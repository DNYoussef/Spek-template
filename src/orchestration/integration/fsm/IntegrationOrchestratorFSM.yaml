# SystemIntegrationOrchestrator FSM Specification
# FSM-First Design for NASA Rule 10 Compliance

metadata:
  version: "1.0.0"
  componentName: "SystemIntegrationOrchestrator"
  description: "FSM controlling system integration lifecycle"
  compliance: "NASA-POT10-Rule-10"
  maxLinesPerComponent: 500
  totalComponents: 6

states:
  IDLE:
    description: "Orchestrator waiting for integration requests"
    entry: "initializeComponents"
    exit: "cleanupIdleState"
    invariants:
      - "activeExecutions.size === 0"
      - "status === 'idle'"

  PLANNING:
    description: "Analyzing and planning integration execution"
    entry: "startPlanningPhase"
    exit: "completePlanningPhase"
    invariants:
      - "currentExecution !== null"
      - "planValidated === false"

  VALIDATING_PLAN:
    description: "Validating integration plan and dependencies"
    entry: "validatePlanDependencies"
    exit: "recordValidationResults"
    invariants:
      - "planValidator.isActive === true"
      - "conflictEngine.isScanning === true"

  EXECUTING:
    description: "Executing integration phases sequentially"
    entry: "startExecution"
    exit: "finalizeExecution"
    invariants:
      - "currentPhase !== null"
      - "execution.status === 'executing'"

  MONITORING:
    description: "Continuous monitoring during execution"
    entry: "startMonitoring"
    exit: "stopMonitoring"
    invariants:
      - "healthMonitor.isActive === true"
      - "qualityMonitor.isActive === true"

  VALIDATING_RESULTS:
    description: "Validating integration results and quality gates"
    entry: "validateResults"
    exit: "recordFinalResults"
    invariants:
      - "allPhasesCompleted === true"
      - "qualityValidator.isActive === true"

  ROLLBACK:
    description: "Rolling back failed integration"
    entry: "startRollback"
    exit: "completeRollback"
    invariants:
      - "rollbackInProgress === true"
      - "execution.status === 'rolling_back'"

  COMPLETED:
    description: "Integration completed successfully"
    entry: "markCompleted"
    exit: "archiveExecution"
    invariants:
      - "execution.status === 'completed'"
      - "qualityGatesPassed === true"

  FAILED:
    description: "Integration failed permanently"
    entry: "markFailed"
    exit: "cleanup"
    invariants:
      - "execution.status === 'failed'"
      - "errorLogged === true"

events:
  START_INTEGRATION:
    description: "Request to start new integration"
    data:
      - "planId: string"
      - "options: IntegrationOptions"

  PLAN_VALIDATED:
    description: "Integration plan validation completed"
    data:
      - "validationResult: ValidationResult"

  PLAN_VALIDATION_FAILED:
    description: "Integration plan validation failed"
    data:
      - "errors: ValidationError[]"

  PHASE_COMPLETED:
    description: "Integration phase completed successfully"
    data:
      - "phaseId: string"
      - "result: PhaseResult"

  PHASE_FAILED:
    description: "Integration phase failed"
    data:
      - "phaseId: string"
      - "error: IntegrationError"

  QUALITY_GATE_PASSED:
    description: "Quality gate validation passed"
    data:
      - "gateId: string"
      - "score: number"

  QUALITY_GATE_FAILED:
    description: "Quality gate validation failed"
    data:
      - "gateId: string"
      - "failure: QualityFailure"

  ROLLBACK_COMPLETED:
    description: "Rollback operation completed"
    data:
      - "rollbackResult: RollbackResult"

  CANCEL_INTEGRATION:
    description: "Request to cancel integration"
    data:
      - "reason: string"

  HEALTH_DEGRADED:
    description: "System health degraded below threshold"
    data:
      - "healthScore: number"

  CONFLICT_DETECTED:
    description: "Integration conflict detected"
    data:
      - "conflict: IntegrationConflict"

transitions:
  IDLE -> PLANNING:
    event: START_INTEGRATION
    guard: "canStartIntegration"
    action: "initializeExecution"

  PLANNING -> VALIDATING_PLAN:
    event: PLAN_CREATED
    guard: "planExists"
    action: "startValidation"

  VALIDATING_PLAN -> EXECUTING:
    event: PLAN_VALIDATED
    guard: "validationPassed"
    action: "beginExecution"

  VALIDATING_PLAN -> FAILED:
    event: PLAN_VALIDATION_FAILED
    guard: "validationCritical"
    action: "markValidationFailed"

  EXECUTING -> MONITORING:
    event: EXECUTION_STARTED
    guard: "executionActive"
    action: "enableMonitoring"

  MONITORING -> EXECUTING:
    event: PHASE_COMPLETED
    guard: "hasMorePhases"
    action: "nextPhase"

  MONITORING -> VALIDATING_RESULTS:
    event: PHASE_COMPLETED
    guard: "allPhasesComplete"
    action: "startResultValidation"

  EXECUTING -> ROLLBACK:
    event: PHASE_FAILED
    guard: "rollbackRequired"
    action: "initializeRollback"

  MONITORING -> ROLLBACK:
    event: HEALTH_DEGRADED
    guard: "healthCritical"
    action: "emergencyRollback"

  VALIDATING_RESULTS -> COMPLETED:
    event: QUALITY_GATE_PASSED
    guard: "allGatesPassed"
    action: "finalizeSuccess"

  VALIDATING_RESULTS -> ROLLBACK:
    event: QUALITY_GATE_FAILED
    guard: "gateBlocking"
    action: "qualityRollback"

  ROLLBACK -> FAILED:
    event: ROLLBACK_COMPLETED
    guard: "rollbackSuccessful"
    action: "markRollbackComplete"

  "*" -> FAILED:
    event: CANCEL_INTEGRATION
    guard: "cancellationRequested"
    action: "cancelAndCleanup"

  COMPLETED -> IDLE:
    event: EXECUTION_ARCHIVED
    guard: "executionArchived"
    action: "resetToIdle"

  FAILED -> IDLE:
    event: CLEANUP_COMPLETED
    guard: "cleanupFinished"
    action: "resetToIdle"

guards:
  canStartIntegration:
    condition: "activeExecutions.size < MAX_CONCURRENT_INTEGRATIONS"
    errorMessage: "Maximum concurrent integrations reached"

  planExists:
    condition: "currentPlan !== null && currentPlan.isValid"
    errorMessage: "Invalid or missing integration plan"

  validationPassed:
    condition: "validationResult.passed === true"
    errorMessage: "Plan validation failed"

  validationCritical:
    condition: "validationResult.criticalErrors.length > 0"
    errorMessage: "Critical validation errors found"

  executionActive:
    condition: "currentExecution.status === 'executing'"
    errorMessage: "Execution not in active state"

  hasMorePhases:
    condition: "currentPhaseIndex < totalPhases - 1"
    errorMessage: "No more phases to execute"

  allPhasesComplete:
    condition: "currentPhaseIndex === totalPhases - 1"
    errorMessage: "Phases still pending"

  rollbackRequired:
    condition: "error.severity === 'critical' || error.blocking === true"
    errorMessage: "Non-critical error - continue execution"

  healthCritical:
    condition: "healthScore < CRITICAL_HEALTH_THRESHOLD"
    errorMessage: "Health score above critical threshold"

  allGatesPassed:
    condition: "qualityGates.every(gate => gate.passed === true)"
    errorMessage: "Not all quality gates passed"

  gateBlocking:
    condition: "failedGate.blockingFailure === true"
    errorMessage: "Quality gate failure is not blocking"

  rollbackSuccessful:
    condition: "rollbackResult.success === true"
    errorMessage: "Rollback operation failed"

  cancellationRequested:
    condition: "cancellationFlag === true"
    errorMessage: "No cancellation requested"

  executionArchived:
    condition: "execution.archived === true"
    errorMessage: "Execution not yet archived"

  cleanupFinished:
    condition: "cleanupResult.completed === true"
    errorMessage: "Cleanup not yet completed"

components:
  IntegrationPlanManager:
    responsibility: "Plan creation, validation, and management"
    maxLines: 450
    states: ["IDLE", "PLANNING", "VALIDATING_PLAN"]

  IntegrationExecutor:
    responsibility: "Phase and component execution coordination"
    maxLines: 480
    states: ["EXECUTING", "MONITORING"]

  IntegrationValidator:
    responsibility: "Quality gates and result validation"
    maxLines: 400
    states: ["VALIDATING_PLAN", "VALIDATING_RESULTS"]

  IntegrationMonitor:
    responsibility: "Health monitoring and conflict detection"
    maxLines: 350
    states: ["MONITORING"]

  ComponentIntegrator:
    responsibility: "Individual component integration logic"
    maxLines: 420
    states: ["EXECUTING"]

  RollbackManager:
    responsibility: "Rollback coordination and recovery"
    maxLines: 300
    states: ["ROLLBACK"]

integration:
  backward_compatibility: true
  api_preservation: true
  event_compatibility: true
  migration_path: "gradual_replacement"

quality_gates:
  nasa_rule_10_compliance: true
  max_lines_per_file: 500
  fsm_coverage: 100
  state_isolation: true
  single_responsibility: true
  zero_theater_code: true